<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おそうじ当番</title>
<meta name="description" content="二人でつかえるおそうじタスク管理">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おそうじ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #1D9E75;
    --teal-dark: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-border: #5DCAA5;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --coral-border: #F0997B;
    --blue-light: #E6F1FB;
    --blue-border: #85B7EB;
    --blue-text: #0C447C;
    --red: #E24B4A;
    --red-light: #FCEBEB;
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a1a;
    --text-2: #555;
    --text-3: #999;
    --radius: 12px;
    --radius-sm: 8px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); font-family: 'Zen Maru Gothic', sans-serif; color: var(--text); }
  body { overflow: hidden; }

  #app { height: 100%; display: flex; flex-direction: column; }

  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* ── HOME ── */
  .home-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; padding-top: calc(var(--safe-top) + 2rem); }
  .home-icon { font-size: 56px; margin-bottom: 12px; }
  .home-title { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .home-sub { font-size: 14px; color: var(--text-2); margin-bottom: 2.5rem; text-align: center; }
  .btn-primary { width: 100%; padding: 15px; border-radius: var(--radius); background: var(--teal); color: white; font-size: 16px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif; border: none; cursor: pointer; margin-bottom: 12px; transition: background 0.15s, transform 0.1s; }
  .btn-primary:active { background: var(--teal-dark); transform: scale(0.98); }
  .divider { font-size: 13px; color: var(--text-3); margin: 4px 0 12px; }
  .join-row { display: flex; gap: 8px; width: 100%; }
  .join-input { flex: 1; padding: 13px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 16px; font-family: 'Zen Maru Gothic', sans-serif; text-transform: uppercase; letter-spacing: 3px; color: var(--text); outline: none; }
  .join-input:focus { border-color: var(--teal); }
  .btn-join { padding: 13px 20px; border-radius: var(--radius-sm); background: var(--teal); color: white; font-size: 15px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif; border: none; cursor: pointer; white-space: nowrap; }
  .btn-join:active { background: var(--teal-dark); }
  .err-msg { font-size: 13px; color: var(--red); margin-top: 8px; min-height: 18px; }

  /* ── CODE SHARE ── */
  .share-wrap { flex: 1; display: flex; flex-direction: column; padding: 1.5rem; padding-top: calc(var(--safe-top) + 1.5rem); }
  .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 15px; color: var(--text-2); cursor: pointer; font-family: 'Zen Maru Gothic', sans-serif; margin-bottom: 1.5rem; padding: 0; }
  .share-card { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; border: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .share-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .share-card p { font-size: 14px; color: var(--text-2); margin-bottom: 1.5rem; }
  .code-box { background: var(--bg); border-radius: var(--radius-sm); padding: 18px 24px; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: var(--teal); border: 2px dashed var(--teal-border); width: 100%; cursor: pointer; transition: background 0.15s; }
  .code-box:active { background: var(--teal-light); }
  .copy-hint { font-size: 12px; color: var(--text-3); margin-top: 8px; margin-bottom: 2rem; }
  .btn-enter { width: 100%; padding: 15px; border-radius: var(--radius); background: var(--teal); color: white; font-size: 16px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif; border: none; cursor: pointer; }
  .btn-enter:active { background: var(--teal-dark); }

  /* ── ROOM ── */
  .room-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1rem; padding-top: calc(var(--safe-top) + 0.75rem); padding-bottom: 0.75rem; display: flex; align-items: center; gap: 10px; }
  .header-back { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-2); padding: 4px; line-height: 1; }
  .header-title { flex: 1; font-size: 17px; font-weight: 700; }
  .header-code { font-size: 11px; color: var(--text-3); background: var(--bg); padding: 4px 8px; border-radius: 99px; letter-spacing: 1px; }

  .room-body { flex: 1; overflow-y: auto; padding: 1rem; padding-bottom: calc(var(--safe-bottom) + 5rem); -webkit-overflow-scrolling: touch; }

  /* ── PRAISE OVERLAY ── */
  .praise-overlay { position: fixed; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .praise-overlay.show { pointer-events: auto; }
  .praise-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 0.3s; }
  .praise-overlay.show .praise-backdrop { background: rgba(0,0,0,0.35); }
  .praise-card { position: relative; background: white; border-radius: 24px; padding: 2.5rem 2rem; text-align: center; max-width: 300px; width: 90%; transform: scale(0.5) translateY(60px); opacity: 0; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .praise-overlay.show .praise-card { transform: scale(1) translateY(0); opacity: 1; }
  .praise-emoji { font-size: 56px; margin-bottom: 12px; display: block; }
  .praise-overlay.show .praise-emoji { animation: bounce 0.6s ease 0.2s both; }
  .praise-msg { font-size: 20px; font-weight: 700; color: var(--teal-dark); line-height: 1.4; }
  .praise-tap { font-size: 13px; color: var(--text-3); margin-top: 12px; }
  @keyframes bounce { 0%{transform:scale(1)} 40%{transform:scale(1.3)} 70%{transform:scale(0.9)} 100%{transform:scale(1)} }
  .confetti-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 24px; }
  .c { position: absolute; width: 8px; height: 8px; border-radius: 2px; top: -10px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(400px) rotate(720deg); opacity:0; } }

  .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1rem; }
  .stat { background: var(--surface); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-lbl { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  .section-head { font-size: 12px; color: var(--text-3); margin: 1rem 0 6px; font-weight: 500; }

  .task-card { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 6px; overflow: hidden; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; transition: background 0.1s; }
  .task-row:active { background: var(--bg); }
  .task-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .task-card.done .task-circle { background: var(--teal); border-color: var(--teal); }
  .checkmark { width: 12px; height: 12px; opacity: 0; }
  .task-card.done .checkmark { opacity: 1; }
  .checkmark::before { content: '✓'; color: white; font-size: 13px; font-weight: 700; }
  .task-info { flex: 1; min-width: 0; }
  .task-name { font-size: 15px; color: var(--text); transition: color 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-card.done .task-name { text-decoration: line-through; color: var(--text-3); }
  .task-meta { display: flex; gap: 6px; margin-top: 3px; align-items: center; }
  .who-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  .who-m { background: var(--coral-light); color: #712B13; }
  .who-p { background: var(--blue-light); color: var(--blue-text); }
  .who-both { background: var(--teal-light); color: var(--teal-dark); }
  .freq-badge { font-size: 11px; color: var(--text-3); }
  .del-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: none; color: var(--text-3); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.1s; flex-shrink: 0; }
  .del-btn:active { background: var(--red-light); color: var(--red); }

  /* ── FAB ── */
  .fab { position: fixed; right: 1.25rem; bottom: calc(var(--safe-bottom) + 1.25rem); width: 56px; height: 56px; border-radius: 50%; background: var(--teal); color: white; font-size: 28px; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(29,158,117,0.4); z-index: 100; transition: transform 0.15s; }
  .fab.visible { display: flex; }
  .fab:active { transform: scale(0.94); }

  /* ── ADD SHEET ── */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
  .sheet-overlay.open { display: block; }
  .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 0 1.25rem 1.25rem; padding-bottom: calc(var(--safe-bottom) + 1.25rem); z-index: 201; transform: translateY(100%); transition: transform 0.3s ease; max-height: 85vh; overflow-y: auto; }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 12px auto 20px; }
  .sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 1.25rem; }
  .field-label { font-size: 13px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
  .text-input { width: 100%; padding: 13px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: var(--bg); font-size: 16px; font-family: 'Zen Maru Gothic', sans-serif; color: var(--text); outline: none; margin-bottom: 1.25rem; }
  .text-input:focus { border-color: var(--teal); background: white; }
  .who-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1.25rem; }
  .who-opt { padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: none; font-size: 13px; font-family: 'Zen Maru Gothic', sans-serif; cursor: pointer; transition: all 0.15s; color: var(--text-2); }
  .who-opt.sel-m { background: var(--coral-light); border-color: var(--coral-border); color: #712B13; font-weight: 700; }
  .who-opt.sel-p { background: var(--blue-light); border-color: var(--blue-border); color: var(--blue-text); font-weight: 700; }
  .who-opt.sel-both { background: var(--teal-light); border-color: var(--teal-border); color: var(--teal-dark); font-weight: 700; }
  .freq-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
  .freq-opt { padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--border); background: none; font-size: 13px; font-family: 'Zen Maru Gothic', sans-serif; cursor: pointer; color: var(--text-2); transition: all 0.15s; }
  .freq-opt.sel { background: var(--teal); border-color: var(--teal); color: white; font-weight: 700; }
  .btn-add-task { width: 100%; padding: 15px; border-radius: var(--radius); background: var(--teal); color: white; font-size: 16px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif; border: none; cursor: pointer; }
  .btn-add-task:active { background: var(--teal-dark); }

  /* ── RESET ── */
  .reset-area { margin-top: 1.5rem; text-align: center; }
  .btn-reset { background: none; border: none; font-size: 13px; color: var(--text-3); cursor: pointer; font-family: 'Zen Maru Gothic', sans-serif; text-decoration: underline; }

  /* ── CONFIRM DIALOG ── */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; display: none; align-items: center; justify-content: center; padding: 2rem; }
  .dialog-overlay.open { display: flex; }
  .dialog-box { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 320px; }
  .dialog-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .dialog-msg { font-size: 14px; color: var(--text-2); margin-bottom: 1.5rem; line-height: 1.6; }
  .dialog-btns { display: flex; gap: 8px; }
  .dialog-btns button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif; cursor: pointer; border: none; }
  .dialog-cancel { background: var(--bg); color: var(--text-2); }
  .dialog-ok { background: var(--red); color: white; }
</style>
</head>
<body>
<div id="app">

  <div id="screen-home" class="screen active">
    <div class="home-wrap">
      <div class="home-icon">🧹</div>
      <div class="home-title">おそうじ当番</div>
      <div class="home-sub">二人でつかえるおそうじタスク</div>
      <button class="btn-primary" id="btnCreateRoom">＋ 新しいルームをつくる</button>
      <div class="divider">または</div>
      <div class="join-row">
        <input class="join-input" id="joinCode" type="text" placeholder="XXXXXX" maxlength="6">
        <button class="btn-join" id="btnJoinRoom">参加</button>
      </div>
      <div class="err-msg" id="homeErr"></div>
    </div>
  </div>

  <div id="screen-share" class="screen">
    <div class="share-wrap">
      <button class="back-btn" id="btnBackHome">← 戻る</button>
      <div class="share-card">
        <h2>ルームができたにゃ！🎉</h2>
        <p>このコードをパートナーに教えてにゃ<br>タップするとコピーできるにゃ</p>
        <div class="code-box" id="codeDisplay">------</div>
        <div class="copy-hint" id="copyHint">タップしてコピー</div>
        <button class="btn-enter" id="btnEnterRoom">ルームに入る →</button>
      </div>
    </div>
  </div>

  <div id="screen-room" class="screen">
    <div class="room-header">
      <button class="header-back" id="btnLeaveRoom">←</button>
      <div class="header-title">おそうじ当番</div>
      <div class="header-code" id="headerCode"></div>
    </div>
    <div class="room-body">
      <div class="praise-banner" id="praiseBanner" style="display:none"></div>
      <div class="stats-row">
        <div class="stat"><div class="stat-num" id="statTodo">0</div><div class="stat-lbl">残り</div></div>
        <div class="stat"><div class="stat-num" id="statDone">0</div><div class="stat-lbl">完了</div></div>
        <div class="stat"><div class="stat-num" id="statRate">0%</div><div class="stat-lbl">達成率</div></div>
      </div>
      <div class="section-head">今日のタスク</div>
      <div id="taskList"></div>
      <div class="reset-area">
        <button class="btn-reset" id="btnResetToday">今日の完了をリセット</button>
      </div>
    </div>
    <button class="fab visible" id="fab" aria-label="タスクを追加">＋</button>
  </div>

</div>

<!-- PRAISE OVERLAY -->
<div class="praise-overlay" id="praiseOverlay" onclick="hidePraise()">
  <div class="praise-backdrop"></div>
  <div class="praise-card" id="praiseCard">
    <div class="confetti-wrap" id="confettiWrap"></div>
    <span class="praise-emoji" id="praiseEmoji">✨</span>
    <div class="praise-msg" id="praiseMsg"></div>
    <div class="praise-tap">タップで閉じる</div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="dialog-overlay" id="confirmDialog">
  <div class="dialog-box">
    <div class="dialog-title" id="dialogTitle"></div>
    <div class="dialog-msg" id="dialogMsg"></div>
    <div class="dialog-btns">
      <button class="dialog-cancel" id="btnDialogCancel">キャンセル</button>
      <button class="dialog-ok" id="dialogOkBtn">退出する</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h3>タスクを追加</h3>
  <div class="field-label">タスク名</div>
  <input class="text-input" id="taskNameInput" type="text" placeholder="例：お風呂掃除" maxlength="30">
  <div class="field-label">担当</div>
  <div class="who-grid">
    <button class="who-opt" id="wo-m">みつき</button>
    <button class="who-opt" id="wo-p">パートナー</button>
    <button class="who-opt sel-both" id="wo-both">ふたりで</button>
  </div>
  <div class="field-label">頻度</div>
  <div class="freq-grid" id="freqGrid"></div>
  <button class="btn-add-task" id="btnAddTask">追加する</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJCG9Kshec_u4LDHyp2XAG9YPLhx-Rdgs",
  authDomain: "osouji-ee5b0.firebaseapp.com",
  projectId: "osouji-ee5b0",
  storageBucket: "osouji-ee5b0.firebasestorage.app",
  messagingSenderId: "395370863482",
  appId: "1:395370863482:web:4cbea18d2b9d1c6cc854c3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const PRAISE = [
  "さいこ〜にゃ！ピカピカにゃ〜！✨",
  "えらいにゃ！おうちが喜んでるにゃ！🏠",
  "すごいにゃ！完璧にゃ！🌟",
  "やったにゃ〜！最高にゃ！🎉",
  "キレイキレイにゃ〜！素晴らしいにゃ！✨",
  "神様みたいにゃ！👑",
  "ふたりで力合わせてえらいにゃ！💪",
  "輝いてるにゃ〜！⭐",
  "おうち大満足にゃ〜！🥰",
  "もふもふも嬉しいにゃ！🐱",
];

const FREQS = ["毎日","週2〜3回","週1回","隔週","月1回","不定期"];

const DEFAULT_TASKS = [
  { id:1, name:"掃除機がけ", who:"both", freq:"週2〜3回" },
  { id:2, name:"トイレ掃除", who:"m", freq:"週1回" },
  { id:3, name:"お風呂掃除", who:"p", freq:"週1回" },
  { id:4, name:"キッチン拭き", who:"m", freq:"毎日" },
  { id:5, name:"ゴミ捨て", who:"p", freq:"週2〜3回" },
  { id:6, name:"洗濯", who:"both", freq:"週2〜3回" },
];

const SAVED_CODE_KEY = 'osouji_last_code';

let currentCode = null;
let selWhoVal = 'both';
let selFreqVal = '週1回';
let unsubscribe = null;

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function genCode() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:6}, ()=>c[Math.floor(Math.random()*c.length)]).join('');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ── ダイアログ ──
function showDialog(title, msg, okLabel, onOk) {
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMsg').textContent = msg;
  const okBtn = document.getElementById('dialogOkBtn');
  okBtn.textContent = okLabel;
  okBtn.onclick = () => { closeDialog(); onOk(); };
  document.getElementById('confirmDialog').classList.add('open');
}
window.closeDialog = function() {
  document.getElementById('confirmDialog').classList.remove('open');
}

// ── ルーム作成 ──
window.createRoom = async function() {
  const code = genCode();
  const roomRef = doc(db, "rooms", code);
  await setDoc(roomRef, { tasks: DEFAULT_TASKS, done: {}, nextId: 20 });
  currentCode = code;
  document.getElementById('codeDisplay').textContent = code;
  document.getElementById('copyHint').textContent = 'タップしてコピー';
  showScreen('share');
}

window.copyCode = function() {
  navigator.clipboard && navigator.clipboard.writeText(currentCode);
  document.getElementById('copyHint').textContent = 'コピーしたにゃ！✓';
}

window.enterRoom = function() {
  localStorage.setItem(SAVED_CODE_KEY, currentCode); // ← 記憶
  startRoomSync(currentCode);
  showScreen('room');
}

// ── ルーム参加 ──
window.joinRoom = async function() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const err = document.getElementById('homeErr');
  if (code.length !== 6) { err.textContent = 'コードは6文字にゃ'; return; }
  const roomSnap = await getDoc(doc(db, "rooms", code));
  if (!roomSnap.exists()) { err.textContent = 'そのコードのルームが見つからないにゃ…'; return; }
  err.textContent = '';
  currentCode = code;
  localStorage.setItem(SAVED_CODE_KEY, code); // ← 記憶
  startRoomSync(code);
  showScreen('room');
}

// ── リアルタイム同期 ──
function startRoomSync(code) {
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(doc(db, "rooms", code), (docSnap) => {
    if (docSnap.exists()) renderRoom(docSnap.data());
  });
}

// ── 退出（確認ダイアログ付き） ──
window.leaveRoom = function() {
  showDialog(
    'ルームを退出するにゃ？',
    '次に入るにはコードが必要にゃ',
    '退出する',
    () => {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      localStorage.removeItem(SAVED_CODE_KEY); // ← 記憶を消す
      currentCode = null;
      showScreen('home');
    }
  );
}

function renderRoom(roomData) {
  document.getElementById('headerCode').textContent = currentCode;
  const today = todayKey();
  const done = roomData.done[today] || {};
  const tasks = roomData.tasks || [];
  const doneCount = tasks.filter(t => done[t.id]).length;
  document.getElementById('statTodo').textContent = tasks.length - doneCount;
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statRate').textContent = tasks.length ? Math.round(doneCount/tasks.length*100)+'%' : '0%';

  const list = document.getElementById('taskList');
  list.innerHTML = '';
  tasks.forEach(t => {
    const isDone = !!done[t.id];
    const card = document.createElement('div');
    card.className = 'task-card' + (isDone ? ' done' : '');
    const whoLabel = t.who==='m' ? 'みつき' : t.who==='p' ? 'パートナー' : 'ふたりで';
    const whoCls = 'who-'+t.who;
    card.innerHTML = `
      <div class="task-row" onclick="toggleTask(${t.id})">
        <div class="task-circle"><div class="checkmark"></div></div>
        <div class="task-info">
          <div class="task-name">${t.name}</div>
          <div class="task-meta">
            <span class="who-badge ${whoCls}">${whoLabel}</span>
            <span class="freq-badge">${t.freq}</span>
          </div>
        </div>
        <button class="del-btn" onclick="event.stopPropagation();deleteTask(${t.id})" aria-label="削除">×</button>
      </div>`;
    list.appendChild(card);
  });
  buildFreqGrid();
}

window.toggleTask = async function(id) {
  const roomRef = doc(db, "rooms", currentCode);
  const roomSnap = await getDoc(roomRef);
  if (!roomSnap.exists()) return;
  const roomData = roomSnap.data();
  const today = todayKey();
  if (!roomData.done[today]) roomData.done[today] = {};
  const wasDone = roomData.done[today][id];
  roomData.done[today][id] = !wasDone;
  await updateDoc(roomRef, { done: roomData.done });
  if (!wasDone) showPraise();
}

window.deleteTask = async function(id) {
  const roomRef = doc(db, "rooms", currentCode);
  const roomSnap = await getDoc(roomRef);
  if (!roomSnap.exists()) return;
  const roomData = roomSnap.data();
  await updateDoc(roomRef, { tasks: roomData.tasks.filter(t => t.id !== id) });
}

window.resetToday = async function() {
  const roomRef = doc(db, "rooms", currentCode);
  const roomSnap = await getDoc(roomRef);
  if (!roomSnap.exists()) return;
  const roomData = roomSnap.data();
  roomData.done[todayKey()] = {};
  await updateDoc(roomRef, { done: roomData.done });
}

window.submitTask = async function() {
  const name = document.getElementById('taskNameInput').value.trim();
  if (!name) return;
  const roomRef = doc(db, "rooms", currentCode);
  const roomSnap = await getDoc(roomRef);
  if (!roomSnap.exists()) return;
  const roomData = roomSnap.data();
  const nextId = roomData.nextId || 20;
  roomData.tasks.push({ id: nextId, name, who: selWhoVal, freq: selFreqVal });
  await updateDoc(roomRef, { tasks: roomData.tasks, nextId: nextId + 1 });
  document.getElementById('taskNameInput').value = '';
  closeSheet();
}

const PRAISE_EMOJIS = ['✨','🎉','🌟','🏆','💫','🥳','🎊','👑','🌈','🐱'];

function showPraise() {
  const messages = PRAISE;
  const msg = messages[Math.floor(Math.random() * messages.length)];
  const emoji = PRAISE_EMOJIS[Math.floor(Math.random() * PRAISE_EMOJIS.length)];

  document.getElementById('praiseMsg').textContent = msg;
  document.getElementById('praiseEmoji').textContent = emoji;

  // 紙吹雪
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#1D9E75','#5DCAA5','#D85A30','#F0997B','#FFD166','#118AB2','#FFB4A2','#B7E4C7'];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement('div');
    c.className = 'c';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 6) + 'px';
    c.style.height = (6 + Math.random() * 6) + 'px';
    c.style.animationDuration = (0.7 + Math.random() * 0.8) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    wrap.appendChild(c);
  }

  const overlay = document.getElementById('praiseOverlay');
  overlay.classList.add('show');
  clearTimeout(window._pt);
  window._pt = setTimeout(hidePraise, 2800);
}

function hidePraise() {
  document.getElementById('praiseOverlay').classList.remove('show');
  clearTimeout(window._pt);
}
window.hidePraise = hidePraise;

window.openSheet = function() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.getElementById('taskNameInput').focus();
}

window.closeSheet = function() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

window.selWho = function(w) {
  selWhoVal = w;
  ['m','p','both'].forEach(x => {
    const b = document.getElementById('wo-'+x);
    b.className = 'who-opt' + (x===w ? ' sel-'+x : '');
  });
}

function buildFreqGrid() {
  const g = document.getElementById('freqGrid');
  if (!g) return;
  g.innerHTML = '';
  FREQS.forEach(f => {
    const b = document.createElement('button');
    b.className = 'freq-opt' + (f===selFreqVal ? ' sel' : '');
    b.textContent = f;
    b.onclick = () => {
      selFreqVal = f;
      document.querySelectorAll('.freq-opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
    };
    g.appendChild(b);
  });
}

// ── イベントリスナー一覧 ──
document.getElementById('btnCreateRoom').addEventListener('click', () => window.createRoom());
document.getElementById('btnJoinRoom').addEventListener('click', () => window.joinRoom());
document.getElementById('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') window.joinRoom(); });
document.getElementById('btnBackHome').addEventListener('click', () => showScreen('home'));
document.getElementById('codeDisplay').addEventListener('click', () => window.copyCode());
document.getElementById('btnEnterRoom').addEventListener('click', () => window.enterRoom());
document.getElementById('btnLeaveRoom').addEventListener('click', () => window.leaveRoom());
document.getElementById('btnResetToday').addEventListener('click', () => window.resetToday());
document.getElementById('fab').addEventListener('click', () => window.openSheet());
document.getElementById('overlay').addEventListener('click', () => window.closeSheet());
document.getElementById('btnAddTask').addEventListener('click', () => window.submitTask());
document.getElementById('btnDialogCancel').addEventListener('click', () => window.closeDialog());
document.getElementById('wo-m').addEventListener('click', () => window.selWho('m'));
document.getElementById('wo-p').addEventListener('click', () => window.selWho('p'));
document.getElementById('wo-both').addEventListener('click', () => window.selWho('both'));

buildFreqGrid();

// ── 起動時：保存済みコードがあれば自動でルームへ ──
(async function autoLogin() {
  const saved = localStorage.getItem(SAVED_CODE_KEY);
  if (!saved) return;
  const roomSnap = await getDoc(doc(db, "rooms", saved));
  if (!roomSnap.exists()) {
    localStorage.removeItem(SAVED_CODE_KEY); // 消えてたら忘れる
    return;
  }
  currentCode = saved;
  startRoomSync(saved);
  showScreen('room');
})();

</script>
